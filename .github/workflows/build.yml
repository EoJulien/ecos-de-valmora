name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Instalar Godot e templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configurar assinatura de debug
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
          cat > "$HOME/.config/godot/$f" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          done

      - name: Exportar APK
        run: |
          unzip -q projeto.zip -d proj
          PROJ=$(dirname "$(find proj -name project.godot | head -n 1)")
          mkdir -p out
          APK="$GITHUB_WORKSPACE/out/ecos-de-valmora.apk"
          # Android exige compressao de textura ETC2/ASTC ligada no projeto
          if ! grep -q import_etc2_astc "$PROJ/project.godot"; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' "$PROJ/project.godot"
          fi
          grep -n -A4 "^\[rendering\]" "$PROJ/project.godot"
          godot --headless --path "$PROJ" --import || true
          set +e

          echo "=== TENTATIVA 1: debug ==="
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --path "$PROJ" --export-debug "Android" "$APK" 2>&1 | tail -n 20

          if [ ! -f "$APK" ]; then
            echo "=== TENTATIVA 2: debug sem variaveis de ambiente ==="
            unset GODOT_ANDROID_KEYSTORE_DEBUG_PATH GODOT_ANDROID_KEYSTORE_DEBUG_USER GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD
            godot --headless --path "$PROJ" --export-debug "Android" "$APK" 2>&1 | tail -n 20
          fi

          echo "=== RESULTADO ==="
          ls -la out
          test -f "$APK"

      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ecos de Valmora - build ${{ github.run_number }}
          files: out/ecos-de-valmora.apk
